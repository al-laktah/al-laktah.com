<header class="site-header">
  <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav>
    {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      {{ partial "icon.html" "moon" }}
      {{ partial "icon.html" "sun" }}
    </button>
  </nav>
</header>
