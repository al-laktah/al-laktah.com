baseURL = "https://al-laktah.com/"
locale = "en"
title = "Mohammed Al-Laktah"
enableRobotsTXT = true

# Keep the site small: no auto-generated tag/category pages.
disableKinds = ["taxonomy", "term"]

[params]
  author = "Mohammed Al-Laktah"
  description = "Personal website of Mohammed Al-Laktah."

  # Social links, shown as icons on the home page and in the footer.
  # Add, remove or reorder entries freely. The icon is picked by name from
  # layouts/_partials/icon.html; names without an icon show as text.
  [[params.socials]]
    name = "GitHub"
    url = "https://github.com/al-laktah/"
  [[params.socials]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/al-laktah/"
  [[params.socials]]
    name = "Email"
    url = "mailto:mohammed@al-laktah.com"

# Top navigation. pageRef points at a file/folder under content/,
# url at anything else (e.g. a file in static/).
[menus]
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 30
  [[menus.main]]
    name = "CV"
    url = "/cv.pdf"
    weight = 40

# RSS feeds for sections (the blog's is at /blog/index.xml), none for the home page.
[outputs]
  home = ["html"]
  section = ["html", "rss"]

[markup.goldmark.renderer]
  # Allow raw HTML inside Markdown (e.g. embeds). Safe because only I write content.
  unsafe = true

[markup.highlight]
  # Output CSS classes; the colors live in assets/css/syntax.css (Catppuccin).
  noClasses = false
